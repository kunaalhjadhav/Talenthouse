# Render Blueprint: creates the API, admin dashboard and website in one go.
# Database: Neon (Postgres). Paste its connection string when Render asks for DATABASE_URL.
# Replace the three service URLs below if you rename the services.
services:
  - type: web
    name: talent-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    preDeployCommand: npx prisma migrate deploy
    startCommand: node dist/main
    healthCheckPath: /api/docs
    envVars:
      - { key: NODE_ENV, value: production }
      - { key: DATABASE_URL, sync: false }
      - { key: JWT_ACCESS_SECRET, generateValue: true }
      - { key: JWT_REFRESH_SECRET, generateValue: true }
      - { key: JWT_ACCESS_EXPIRES, value: 15m }
      - { key: JWT_REFRESH_EXPIRES, value: 30d }
      - { key: RAZORPAY_KEY_ID, sync: false }
      - { key: RAZORPAY_KEY_SECRET, sync: false }
      - { key: RAZORPAY_WEBHOOK_SECRET, sync: false }
      - { key: MUX_TOKEN_ID, sync: false }
      - { key: MUX_TOKEN_SECRET, sync: false }
      - { key: MUX_WEBHOOK_SECRET, sync: false }
      - { key: SMSLOCAL_API_KEY, sync: false }
      - { key: SMSLOCAL_SENDER_ID, sync: false }
      - { key: SMSLOCAL_DLT_TEMPLATE_ID, sync: false }
      - { key: FIREBASE_PROJECT_ID, sync: false }
      - { key: FIREBASE_CLIENT_EMAIL, sync: false }
      - { key: FIREBASE_PRIVATE_KEY, sync: false }

  - type: web
    name: talent-admin
    runtime: node
    rootDir: admin-dashboard
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - { key: NEXT_PUBLIC_API_URL, value: "https://talent-api.onrender.com/api/v1" }

  - type: web
    name: talent-website
    runtime: node
    rootDir: website
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - { key: NEXT_PUBLIC_API_URL, value: "https://talent-api.onrender.com/api/v1" }
